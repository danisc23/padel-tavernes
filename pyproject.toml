[tool.poetry]
name = "padel-tavernes"
version = "0.1.0"
description = "padel statistics in tavernes blanques"
authors = ["Daniel Sanchez Campillos"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.5"
beautifulsoup4 = "^4.14.2"
Flask = "^3.1.2"
pydantic = "^2.12.3"
unidecode = "^1.4.0"
flask-restx = "^1.3.2"
geopy = "^2.4.1"
flask-caching = "^2.3.1"
flask-cors = "^6.0.1"
redis = "^7.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.9.0"
autoflake = "^2.3.1"
isort = "^5.13.2"
flake8 = "^7.3.0"
mypy = "^1.18.2"
types-requests = "^2.32.0.20241016"
types-beautifulsoup4 = "^4.12.0.20241020"
freezegun = "^1.5.5"
flake8-print = "^5.0.0"
pytest-mock = "^3.15.1"
types-pytz = "^2024.2.0.20241003"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
